# PostgreSQL overlay — pgvector for multi-tenant storage.
#
# Usage (web dashboard built-in by default):
#   make up
#   # or: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#
# Required env vars (set in .env or shell):
#   GOCLAW_OPENROUTER_API_KEY (or another provider key)
#   POSTGRES_PASSWORD (defaults to "goclaw" for dev)

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      # Loopback by default: goclaw reaches Postgres over the compose
      # network as "postgres:5432" and never through a host port. Publishing
      # on 0.0.0.0 writes an iptables rule into the DOCKER chain, which is
      # evaluated before ufw — so a published 5432 stays reachable from the
      # internet even when the firewall says it is denied. Override with
      # POSTGRES_BIND only on a host that is not public.
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goclaw}
      POSTGRES_DB: ${POSTGRES_DB:-goclaw}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-goclaw} -d ${POSTGRES_DB:-goclaw}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          # Without a cap Postgres is the one container free to grow into the
          # host's spare RAM; the kernel then OOM-kills the largest process,
          # which is goclaw, and that loses every in-flight job at once.
          memory: ${POSTGRES_MEM_LIMIT:-4G}
          cpus: '${POSTGRES_CPU_LIMIT:-1.0}'
    restart: unless-stopped

  goclaw:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - GOCLAW_POSTGRES_DSN=postgres://${POSTGRES_USER:-goclaw}:${POSTGRES_PASSWORD:-goclaw}@postgres:5432/${POSTGRES_DB:-goclaw}?sslmode=disable
    volumes:
      - goclaw-skills:/app/skills
      - goclaw-workspace:/app/.goclaw

volumes:
  postgres-data:
  goclaw-skills:
