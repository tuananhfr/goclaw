# Local-dev overlay for the ERPcons Drupal site (WAMP on the host).
#
# Usage: add to COMPOSE_FILE in .env (after the other files), then
#   docker compose up -d goclaw
#
# Why: GoClaw posts job callbacks back into Drupal at
# http://erpcons.localhost/api/erp-ocr/callback/<uuid>. Inside the container
# that hostname does not resolve, so every callback failed ("dial tcp") and
# each batch had to wait for the Drupal cron poll — on a dev box with no cron
# that meant waiting for a human. Same pattern as docker-compose.tekshot-local.yml:
# map the real hostname to the host gateway so the Host header still matches
# the Apache vhost (calling host.docker.internal would land on the default
# vhost).
#
# Not needed once callbacks go through a tunnel or a real domain.
services:
  goclaw:
    extra_hosts:
      - "erpcons.localhost:host-gateway"

  # Sidecar MCP: cùng lý do với goclaw ở trên — nó gọi REST của Drupal đang chạy
  # trên WAMP của host, và Host header phải khớp vhost Apache.
  #
  # Cổng publish cũng để ở đây chứ không ở file dùng chung: nó chỉ phục vụ việc
  # chạy tay `test-client.mjs` / `test-chat.mjs` từ host. Production không cần —
  # GoClaw gọi sidecar bằng tên container trong mạng compose.
  erpcons-mcp:
    extra_hosts:
      - "erpcons.localhost:host-gateway"
    ports:
      - "${ERPCONS_MCP_PORT:-3300}:3300"
